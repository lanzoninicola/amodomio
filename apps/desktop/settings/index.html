<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Configurações do KDS</title>
    <link rel="stylesheet" href="/settings/style.css" />
  </head>
  <body>
    <h1>Configurações do KDS</h1>
    <h2>Status visíveis</h2>
    <p>Escolha os accordions exibidos no KDS.</p>
    <form id="statuses"></form>
    <h2>Som dos alertas</h2>
    <label><input id="sound-enabled" type="checkbox" />Ativar som</label>
    <div class="volume-control">
      <label for="sound-volume"
        >Volume <output id="volume-value"></output
      ></label>
      <input id="sound-volume" type="range" min="0" max="100" step="5" />
    </div>
    <button id="test-sound" type="button">Testar som</button>
    <p id="sound-feedback" role="status" aria-live="polite"></p>
    <p id="error" role="alert"></p>
    <button id="save">Salvar e fechar</button>
    <script src="/settings/settings.js" defer></script>
  </body>
</html>
